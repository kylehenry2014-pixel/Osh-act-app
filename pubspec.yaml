name: ohs_act_regulations
description: "OHS Act & Regulations - South African occupational health and safety reference app"
publish_to: 'none'
version: 1.0.0+14
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  google_mobile_ads: ^5.2.0
  in_app_purchase: 3.3.0
  in_app_purchase_android: 0.5.0
  connectivity_plus: ^6.1.0
  open_file: ^3.5.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: 3.0.1
  uuid: ^4.5.1
  flutter_file_dialog: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Thin.otf
          weight: 100
        - asset: assets/fonts/Inter-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/Inter-Light.otf
          weight: 300
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Inter-Black.otf
          weight: 900
  assets:
    - assets/data/entries.json
    - assets/data/iso_clauses.json
    - assets/data/translations_af.json
    - assets/toolbox_talks_index_v2.json
    - assets/toolbox_talks/
    - assets/data/signage.json
    - assets/signage/
    - assets/fonts/LICENSE.txt

flutter_native_splash:
  color: "#1B1E19"
  color_dark: "#1B1E19"
  android_12:
    color: "#1B1E19"
    color_dark: "#1B1E19"
    image: assets/splash/transparent_splash.png
    image_dark: assets/splash/transparent_splash.png
  ios: false
  web: false
