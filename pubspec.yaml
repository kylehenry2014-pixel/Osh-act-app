name: ohs_act_regulations
description: "OHS Act & Regulations - South African occupational health and safety reference app"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  google_mobile_ads: ^5.2.0
  in_app_purchase: ^3.2.0
  connectivity_plus: ^6.1.0
  open_file: ^3.5.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  uuid: ^4.5.1
  flutter_file_dialog: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/entries.json
    - assets/data/iso_clauses.json
    - assets/data/translations_af.json
    - assets/toolbox_talks_index_v2.json
    - assets/toolbox_talks/