name: Build Android App Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: 'stable'

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release.jks" >> android/key.properties

      - name: Verify Flutter SDK
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Report purchasing dependencies
        run: |
          flutter pub deps --style=compact | grep -E 'in_app_purchase'

      - name: Upload dependency lock file
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: pubspec.lock
          if-no-files-found: error

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Override targetSdkVersion
        run: |
          echo "flutter.targetSdkVersion=36" >> android/local.properties

      - name: Diagnose Android toolchain
        run: flutter doctor -v

      - name: Build App Bundle
        run: flutter build appbundle --release --verbose

      - name: Report native Google Play Billing dependencies
        working-directory: android
        run: |
          set -o pipefail
          bash gradlew :app:dependencyInsight \
            --configuration releaseRuntimeClasspath \
            --dependency com.android.billingclient \
            | tee ../billing-dependencies.txt

      - name: Upload billing dependency report
        uses: actions/upload-artifact@v4
        with:
          name: billing-dependency-report
          path: billing-dependencies.txt
          if-no-files-found: error

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab