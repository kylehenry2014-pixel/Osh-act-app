name: Build Android App Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release.jks" >> android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Override targetSdkVersion
        run: |
          echo "flutter.targetSdkVersion=36" >> android/local.properties

      - name: Build App Bundle
        id: build
        continue-on-error: true
        run: flutter build appbundle --release

      - name: Check whether the .aab was actually produced
        run: |
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            echo "AAB file exists - treating as success despite flutter_tools' own exit code."
            ls -la build/app/outputs/bundle/release/app-release.aab
          else
            echo "AAB file genuinely missing - this is a real failure."
            exit 1
          fi

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab