name: Build Android App Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: 'stable'

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077

          : "${ANDROID_KEYSTORE_BASE64:?Missing Android keystore secret}"
          : "${KEYSTORE_PASSWORD:?Missing keystore password secret}"
          : "${KEY_PASSWORD:?Missing key password secret}"
          : "${KEY_ALIAS:?Missing key alias secret}"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/app/release.jks

          test -s android/app/release.jks

          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape_property(value):
              result = []
              for char in value:
                  if char == "\\":
                      result.append("\\\\")
                  elif char in " :=#!":
                      result.append("\\" + char)
                  elif char == "\t":
                      result.append("\\t")
                  elif char == "\r":
                      result.append("\\r")
                  elif char == "\n":
                      result.append("\\n")
                  elif char == "\f":
                      result.append("\\f")
                  elif ord(char) < 32 or ord(char) > 126:
                      raw = char.encode("utf-16-be")
                      for i in range(0, len(raw), 2):
                          result.append(
                              "\\u" + raw[i:i+2].hex()
                          )
                  else:
                      result.append(char)
              return "".join(result)

          properties = {
              "storePassword": os.environ["KEYSTORE_PASSWORD"],
              "keyPassword": os.environ["KEY_PASSWORD"],
              "keyAlias": os.environ["KEY_ALIAS"],
              "storeFile": "release.jks",
          }

          content = "".join(
              f"{key}={escape_property(value)}\n"
              for key, value in properties.items()
          )

          Path("android/key.properties").write_text(
              content, encoding="ascii"
          )
          PY

          chmod 600 android/app/release.jks android/key.properties
          test -s android/key.properties

      - name: Verify Flutter SDK
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Report purchasing dependencies
        run: |
          flutter pub deps --style=compact | grep -E 'in_app_purchase'

      - name: Upload dependency lock file
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: pubspec.lock
          if-no-files-found: error

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Override targetSdkVersion
        run: |
          echo "flutter.targetSdkVersion=36" >> android/local.properties

      - name: Diagnose Android toolchain
        run: flutter doctor -v

      - name: Build App Bundle
        run: flutter build appbundle --release --verbose

      - name: Report native Google Play Billing dependencies
        working-directory: android
        run: |
          set -o pipefail
          bash gradlew :app:dependencyInsight \
            --configuration releaseRuntimeClasspath \
            --dependency com.android.billingclient \
            | tee ../billing-dependencies.txt

      - name: Upload billing dependency report
        uses: actions/upload-artifact@v4
        with:
          name: billing-dependency-report
          path: billing-dependencies.txt
          if-no-files-found: error

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab